name: Fetch LinkedIn Posts

on:
  schedule:
    - cron: '0 9 * * 1'  # Runs every Monday at 9:00 AM UTC
  workflow_dispatch:       # Allows manual triggering from the GitHub Actions tab

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit generated markdown files
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_primary.outputs.page_url || steps.deploy_retry.outputs.page_url }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 google-genai python-dotenv
          
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
          
      - name: Run LinkedIn to News script
        env:
          LI_AT_COOKIE: ${{ secrets.LI_AT_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python linkedin_to_news.py
          
      - name: Commit and push generated news files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(news): auto-update LinkedIn news entries"
          file_pattern: "src/data/news/*.md processed_posts.json"
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Node dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deploy_primary
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry deploy to GitHub Pages (transient failure)
        id: deploy_retry
        if: steps.deploy_primary.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Verify deployment succeeded
        if: always()
        run: |
          primary="${{ steps.deploy_primary.outcome }}"
          retry="${{ steps.deploy_retry.outcome }}"
          if [ "$primary" != "success" ] && [ "$retry" != "success" ]; then
            echo "Both deployment attempts failed."
            exit 1
          fi
